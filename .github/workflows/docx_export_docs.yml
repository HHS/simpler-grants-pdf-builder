# docx_export_docs.yml
#
# Fails when a PR changes Word (DOCX) export code without updating
# documentation/DOCX_EXPORT.md. Add the `docs-not-needed` label to skip the check
# when a change does not affect anything the page describes (for example, a
# refactor or a test-only change).
#
# The file lists below are the source of truth for what counts as Word export
# code. Keep them in sync with:
#   - documentation/DOCX_EXPORT.md § Keeping this page current
#   - AGENTS.md § Keep Word export docs current
#   - .github/pull_request_template.md (Word export checklist item)

name: Word Export Docs Check

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled

permissions:
  contents: read

jobs:
  check-docx-export-docs:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'docs-not-needed') }}
    name: Check DOCX_EXPORT.md is updated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare changed files
        shell: python
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          import ast
          import os
          import re
          import subprocess

          DOC = "documentation/DOCX_EXPORT.md"

          # Files that exist only for Word export. Any change counts.
          EXPORT_FILES = {
              "nofos/bloom_nofos/templates/includes/docx_download_button_form.html",
              "nofos/bloom_nofos/templates/includes/download_docx_button.html",
              "nofos/composer/templates/composer/composer_export.html",
              "nofos/composer/templates/composer/writer/docx_export.html",
              "nofos/nofos/templates/nofos/includes/nofo_export_document.html",
              "nofos/nofos/templates/nofos/nofo_export.html",
              "nofos/nofos/templatetags/truncate_anchor_links_for_docx.py",
          }

          # Shared files that hold Word export code next to other code. A change
          # counts when a changed line or its enclosing export scope is tracked.
          SHARED_FILES = {
              "Dockerfile",  # gunicorn timeout
              "nofos/bloom_nofos/settings.py",
              "nofos/bloom_nofos/utils.py",
              "nofos/composer/views.py",
              "nofos/nofos/views.py",
          }
          # Kept narrow on purpose: Word *import* code also mentions "docx".
          EXPORT_PATTERN = re.compile(
              r"grabzit|is_valid_docx|generate_docx_download_response"
              r"|download_target|(NOFOs|Composer|WriterInstance)ExportView"
              r"|--timeout",
              re.IGNORECASE,
          )

          base, head = os.environ["BASE_SHA"], os.environ["HEAD_SHA"]

          def git(*args):
              return subprocess.run(
                  ["git", *args], check=True, capture_output=True, text=True
              ).stdout

          merge_base = git("merge-base", base, head).strip()
          revs = f"{merge_base}..{head}"
          HUNK = re.compile(r"^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@")

          DECLARATIONS = (ast.ClassDef, ast.FunctionDef, ast.AsyncFunctionDef)
          FUNCTIONS = (ast.FunctionDef, ast.AsyncFunctionDef)

          def export_scopes(tree, path):
              for node in ast.walk(tree):
                  if isinstance(node, DECLARATIONS) and EXPORT_PATTERN.search(node.name):
                      yield node
                  elif (
                      path == "nofos/composer/views.py"
                      and isinstance(node, ast.ClassDef)
                      and node.name == "WriterInstancePreviewView"
                  ):
                      yield from (
                          member
                          for member in node.body
                          if isinstance(member, FUNCTIONS) and member.name == "post"
                      )
                  elif path == "nofos/bloom_nofos/settings.py":
                      if isinstance(node, ast.Assign):
                          targets = node.targets
                      elif isinstance(node, ast.AnnAssign):
                          targets = [node.target]
                      else:
                          continue
                      if any(
                          isinstance(target, ast.Name) and EXPORT_PATTERN.search(target.id)
                          for target in targets
                      ):
                          yield node

          def touches_export(revision, path, ranges):
              ranges = [span for span in ranges if span]
              if not ranges:
                  return False

              source = git("show", f"{revision}:{path}")
              lines = source.split("\n")
              if any(
                  EXPORT_PATTERN.search(lines[number - 1])
                  for span in ranges
                  for number in span
              ):
                  return True

              if not path.endswith(".py"):
                  return False

              # Use Python's declaration boundaries, not Git's hunk labels.
              tree = ast.parse(source, filename=path)
              for node in export_scopes(tree, path):
                  decorators = getattr(node, "decorator_list", ())
                  start = min([node.lineno, *(item.lineno for item in decorators)])
                  if any(span.start <= node.end_lineno and start < span.stop for span in ranges):
                      return True
              return False

          changed = set(git("diff", "--no-renames", "--name-only", revs).splitlines())
          if DOC in changed:
              print(f"{DOC} was updated.")
              raise SystemExit(0)

          triggers = sorted(changed & EXPORT_FILES)
          for path in sorted(changed & SHARED_FILES):
              diff = git("diff", "--no-renames", "--unified=0", revs, "--", path)
              removed, added = [], []
              for line in diff.splitlines():
                  match = HUNK.match(line)
                  if match:
                      old_start, old_count, new_start, new_count = match.groups()
                      old_start, new_start = int(old_start), int(new_start)
                      removed.append(range(old_start, old_start + int(old_count or 1)))
                      added.append(range(new_start, new_start + int(new_count or 1)))
              if touches_export(merge_base, path, removed) or touches_export(head, path, added):
                  triggers.append(path)

          if not triggers:
              print("No Word export changes found.")
              raise SystemExit(0)

          print("Word export code changed in:")
          for path in triggers:
              print(f"  - {path}")
          print(
              f"::error::Word export code changed but {DOC} was not updated. "
              f"Update {DOC} to match, or add the 'docs-not-needed' label if "
              "nothing it describes has changed."
          )
          raise SystemExit(1)
