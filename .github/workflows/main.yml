# main.yml
name: Orchestrator Workflow

on:
  pull_request:
    branches:
      - "**"

  push:
    branches:
      - main

jobs:
  ci:
    uses: ./.github/workflows/django_ci.yml # Call the CI workflow
    with:
      branch: ${{ github.ref_name }}
    secrets: inherit

  code-scans:
    uses: ./.github/workflows/code_scans.yml # Call the code scans workflow (Anchore/grype scan)
    with:
      branch: ${{ github.ref_name }}
