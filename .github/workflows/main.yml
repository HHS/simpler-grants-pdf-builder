# main.yml
name: Orchestrator Workflow

on:
  pull_request:
    branches:
      - "**"

  push:
    branches:
      - main

  # Allows release_please.yml to trigger CI on a release PR's branch: PRs opened by
  # the default GITHUB_TOKEN don't fire pull_request-triggered workflows on their own.
  workflow_dispatch:

jobs:
  run-tests:
    name: Run Tests
    uses: ./.github/workflows/django_ci.yml # Call the unit test workflow
    with:
      branch: ${{ github.ref_name }}
    secrets: inherit

  code-scans:
    name: Code Scans
    uses: ./.github/workflows/code_scans.yml # Call the code scans workflow (Trivy/Anchore/Dockle)
    with:
      branch: ${{ github.ref_name }}
