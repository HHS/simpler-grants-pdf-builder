name: Django CI

on:
  # Triggered only by the orchestrator workflow (main.yml), which already runs on
  # every PR and on push to main. A pull_request trigger here as well would run
  # this workflow twice per PR.
  workflow_call: # Allow this workflow to be called by other workflows
    inputs:
      branch:
        description: "Branch to run CI on"
        required: false
        default: "main"
        type: "string"

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nofos
    steps:
      - uses: actions/checkout@v4.4.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: Gr1N/setup-poetry@v9

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: ${{ runner.os }}-poetry-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install

      - name: Run tests
        run: poetry run python manage.py test

      - name: Run JavaScript unit tests
        # Uses Node's built-in test runner (available on ubuntu-latest); no npm dependencies.
        run: node --test ../tests/js/*.test.cjs
