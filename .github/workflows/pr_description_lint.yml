name: PR Description Lint

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions: {}

jobs:
  lint-pr-description:
    # Advisory only. Do not add this job to the required merge checks.
    # Dependabot and Release Please generate their own PR descriptions.
    if: >-
      ${{ github.event.pull_request.user.login != 'dependabot[bot]' &&
        !(github.event.pull_request.user.type == 'Bot' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.head_ref, 'release-please--branches--') &&
        startsWith(github.event.pull_request.title, 'chore(')) }}
    name: Lint PR Description
    runs-on: ubuntu-latest
    steps:
      - name: Check template headings
        shell: python
        run: |
          import json
          import os
          import re
          from pathlib import Path

          # Keep these in sync with .github/pull_request_template.md.
          required = ["Summary", "Test plan", "UI evidence", "Checklist"]
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          body = event["pull_request"]["body"] or ""
          headings = [
              match.group(1)
              for line in body.splitlines()
              if (match := re.fullmatch(r"##[ \t]+(.+?)\s*", line))
              and match.group(1) in required
          ]

          missing = [heading for heading in required if heading not in headings]
          if missing:
              print("::error::Missing PR template headings: " + ", ".join(missing))
              raise SystemExit(1)
          if headings != required:
              print("::error::Use each PR template heading once, in order: " + ", ".join(required))
              raise SystemExit(1)
