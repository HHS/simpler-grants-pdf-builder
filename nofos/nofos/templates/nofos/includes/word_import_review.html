{% for message in messages %}
  {% if "word-import-review" in message.tags %}
    <div class="usa-alert usa-alert--warning margin-y-3" role="alert">
      <div class="usa-alert__body">
        <h2 class="usa-alert__heading text-bold">Review preserved Word text boxes</h2>
        <p class="usa-alert__text">{{ message }}</p>
      </div>
    </div>
  {% endif %}
{% endfor %}
