{% extends 'nofos/design_pilot_base.html' %}
{% block pilot_content %}
<h1 class="font-heading-xl text-bold">Request not saved</h1>
<div class="usa-alert usa-alert--error"><div class="usa-alert__body"><p class="usa-alert__text">{{ message }}</p></div></div>
<p>Return to the candidate and review its current state before trying again.</p>
{% if candidate_url %}<p><a href="{{ candidate_url }}">Return to current candidate</a></p>{% endif %}
<a href="{% url 'design_pilot:index' %}">Start or retry an import</a>
{% endblock %}
